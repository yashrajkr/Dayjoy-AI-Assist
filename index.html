<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dayjoy AI Assist — Enterprise AI Assistant for Dayjoy wellness, healthcare, agriculture, and direct-selling ecosystem. Approved knowledge. Safe answers. Human escalation when needed." />
    <meta name="theme-color" content="#DD6B3D" />
    <meta name="application-name" content="Dayjoy AI Assist" />
    <meta name="apple-mobile-web-app-title" content="Dayjoy AI Assist" />
    <!-- Standard tag Chrome/Chromium now wants, kept alongside the Apple-
         prefixed one below since iOS Safari still only honors that one. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dayjoy AI Assist" />
    <meta property="og:description" content="Enterprise AI Assistant for Dayjoy — approved knowledge, safe answers, human escalation when needed." />
    <meta property="og:site_name" content="Dayjoy AI Assist" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Dayjoy AI Assist" />
    <meta name="twitter:description" content="Enterprise AI Assistant for Dayjoy." />

    <!-- Favicon: inline SVG (lotus mark in Dayjoy coral-orange) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23DD6B3D'/%3E%3Cpath d='M32 14c-9.4 0-17 7.4-17 16.6 0 5.2 2.4 9.8 6.2 12.9V48l5.4-3c1.7.4 3.5.6 5.4.6 9.4 0 17-7.4 17-16.6S41.4 14 32 14z' fill='%23FFFFFF'/%3E%3Cpath d='M24 30c4-1.3 8-1.3 12 0M24 35c4-1 8-1 12 0' stroke='%23DD6B3D' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Cpath d='M40 40c2 4 6 6 10 6-1-3-2-6-4-8-2-2-4-3-6-2z' fill='%23FFC98B'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23DD6B3D'/%3E%3Cpath d='M32 14c-9.4 0-17 7.4-17 16.6 0 5.2 2.4 9.8 6.2 12.9V48l5.4-3c1.7.4 3.5.6 5.4.6 9.4 0 17-7.4 17-16.6S41.4 14 32 14z' fill='%23FFFFFF'/%3E%3C/svg%3E" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Typography: Plus Jakarta Sans (UI) + Fraunces (AI-voice text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />

    <title>Dayjoy AI Assist — Enterprise AI Assistant</title>

    <!-- Boot loader: prevents white flash + shows branded splash until React mounts -->
    <style>
      /* This unlayered background always outranks the app's `@layer base`
         body rule (unlayered CSS beats layered CSS regardless of source
         order/specificity), so it must react to `.dark` directly — next-themes
         adds/removes that class on <html> — or the page stays pinned to the
         light color forever, including after switching to dark mode. */
      html, body { min-height: 100%; margin: 0; background: #FBF7F1; }
      html.dark, html.dark body { background: #1C130E; }
      #root { min-height: 100vh; }
      .dj-boot-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 18px;
        background: linear-gradient(180deg, #FBF7F1 0%, #F3EAD8 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: #2A2019;
        z-index: 9999;
        transition: opacity 240ms ease-out;
      }
      .dj-boot-splash.is-hidden { opacity: 0; pointer-events: none; }
      .dj-boot-logo {
        width: 64px; height: 64px;
        border-radius: 14px;
        background: #DD6B3D;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 12px 32px -8px rgba(221, 107, 61, 0.35);
        animation: dj-pulse 1.6s ease-in-out infinite;
      }
      .dj-boot-logo svg { width: 38px; height: 38px; }
      .dj-boot-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
      .dj-boot-subtitle { font-size: 13px; color: #7A6D63; }
      .dj-boot-bar {
        width: 160px; height: 3px;
        background: rgba(221, 107, 61, 0.12);
        border-radius: 999px; overflow: hidden;
      }
      .dj-boot-bar::after {
        content: ''; display: block;
        width: 40%; height: 100%;
        background: #DD6B3D;
        border-radius: 999px;
        animation: dj-slide 1.1s ease-in-out infinite;
      }
      @keyframes dj-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes dj-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
      @media (prefers-reduced-motion: reduce) {
        .dj-boot-logo, .dj-boot-bar::after { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="dj-boot-splash" id="dj-boot-splash" role="status" aria-live="polite" aria-label="Loading Dayjoy AI Assist">
        <div class="dj-boot-logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 14c-9.4 0-17 7.4-17 16.6 0 5.2 2.4 9.8 6.2 12.9V48l5.4-3c1.7.4 3.5.6 5.4.6 9.4 0 17-7.4 17-16.6S41.4 14 32 14z" fill="#FFFFFF"/>
            <path d="M24 30c4-1.3 8-1.3 12 0M24 35c4-1 8-1 12 0" stroke="#DD6B3D" stroke-width="2" stroke-linecap="round" fill="none"/>
            <path d="M40 40c2 4 6 6 10 6-1-3-2-6-4-8-2-2-4-3-6-2z" fill="#FFC98B"/>
          </svg>
        </div>
        <div class="dj-boot-title">Dayjoy AI Assist</div>
        <div class="dj-boot-subtitle">Enterprise AI Assistant</div>
        <div class="dj-boot-bar" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide boot splash once React mounts (best-effort; React removes #root children anyway)
      window.addEventListener('load', function () {
        setTimeout(function () {
          var s = document.getElementById('dj-boot-splash');
          if (s) {
            s.classList.add('is-hidden');
            setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 300);
          }
        }, 400);
      });
    </script>
  </body>
</html>
